services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: aitunator-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aitunator-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      RAG_MODE: ${RAG_MODE:-mock}
      SQLITE_PATH: /app/runtime/aitunator.db
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kb}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      LLM_MAIN_MODEL: ${LLM_MAIN_MODEL:-llama-3.3-70b-versatile}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-llama-3.1-8b-instant}
      EMBEDDER: ${EMBEDDER:-BAAI/bge-m3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      RERANKER: ${RERANKER:-noop}
      RERANK_PROVIDER: ${RERANK_PROVIDER:-noop}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      TTFT_TIMEOUT_SECONDS: ${TTFT_TIMEOUT_SECONDS:-15}
      TOTAL_TIMEOUT_SECONDS: ${TOTAL_TIMEOUT_SECONDS:-60}
    volumes:
      - app_runtime:/app/runtime
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant_storage:
  app_runtime:

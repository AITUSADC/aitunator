[project]
name = "aitunator-search"
version = "0.1.0"
description = "AITU hybrid retrieval, program-aware selection and offline evaluation"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "rank-bm25==0.2.2",
    "nltk==3.10.3",
]

[project.optional-dependencies]
models = [
    "torch==2.8.0",
    "sentence-transformers==5.1.2",
    "transformers==4.57.6",
]
qdrant = ["qdrant-client==1.19.1", "python-dotenv>=1.0.0", "tqdm>=4.66.0"]
pdf = ["docling>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "eval"]

[tool.hatch.build.targets.wheel.force-include]
"eval/golden.jsonl" = "eval/golden.jsonl"
